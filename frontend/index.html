<!doctype html>
<html lang="<!-- figma:lang -->" dir="rtl">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title><!-- figma:title --></title>
    <link rel="icon" type="image/png" href="/karzar-shield-detailed.png" />
    <link rel="apple-touch-icon" href="/karzar-shield-detailed.png" />
    <link rel="canonical" href="https://boomedu.ir/" />
    <link rel="preload" href="/fonts/boom-persian-1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/boom-persian-5.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#1b1214" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fff7f5" media="(prefers-color-scheme: light)" />
    <!-- figma:head-end -->
  </head>
  <body class="dark">
    <script>
      // Set the actual theme root before React paints; Sunset is the default.
      try {
        const dark = localStorage.getItem("boom-theme") !== "light";
        document.documentElement.classList.toggle("dark", dark);
        document.body.classList.toggle("dark", dark);
        const prefs = JSON.parse(localStorage.getItem("boom-experience") || "{}");
        document.documentElement.dataset.palette = ["coral", "mint", "iris"].includes(prefs?.palette) ? prefs.palette : "coral";
        document.documentElement.dataset.calm = String(prefs?.calm === true);
      } catch {
        document.documentElement.classList.add("dark");
        document.documentElement.dataset.palette = "coral";
      }
    </script>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
