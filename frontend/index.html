<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title><!-- figma:title --></title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0E0B08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F6F2" media="(prefers-color-scheme: light)" />
    <!-- figma:head-end -->
  </head>
  <body class="dark">
    <script>
      const theme = localStorage.getItem("boom-theme");
      if (theme === "light") {
        document.body.classList.remove("dark");
      } else {
        document.body.classList.add("dark");
      }
    </script>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
