<!doctype html>
<html lang="<!-- figma:lang -->" dir="rtl">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title><!-- figma:title --></title>
    <link rel="icon" type="image/png" href="/karzar-shield-detailed.png" />
    <link rel="apple-touch-icon" href="/karzar-shield-detailed.png" />
    <link rel="canonical" href="https://boomedu.ir/" />
    <link rel="preload" href="/fonts/boom-persian-1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/boom-persian-5.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#0E0B08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F6F2" media="(prefers-color-scheme: light)" />
    <!-- figma:head-end -->
  </head>
  <body class="dark">
    <script>
      const theme = localStorage.getItem("boom-theme");
      if (theme === "light") {
        document.body.classList.remove("dark");
      } else {
        document.body.classList.add("dark");
      }
    </script>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
