# fly.toml for Boom deployment
app = "boom"
primary_region = "iad"

[build]
  # Use the existing Dockerfile if present, otherwise build from Python
  builder = "base/image"

[env]
  # LLM configuration
  LLM_PROVIDER = "groq"
  EMBEDDING_PROVIDER = "ollama"
  LLM_API_KEY = ""  # Set in dashboard or .env
  EMBEDDING_API_KEY = ""

  # Cloudflare R2 configuration (optional - local fallback works)
  R2_ACCOUNT_ID = ""
  R2_ACCESS_KEY_ID = ""
  R2_SECRET_ACCESS_KEY = ""
  R2_BUCKET_NAME = ""

  # Application paths
  CHROMA_DIR = "data/chroma_db"
  UPLOAD_DIR = "data/uploads"
  IMAGES_DIR = "data/page_images"

[env.from_file]
  # Load .env file if present
  .env

[services]
  # Backend service
  [services.internal_8080]
    # This service will be accessible via flyio internal routing
    http_check = "/health"
    restart_policy = "always"

  [services.web]
    # Public HTTPS service
    port = 8080
    processes = ["api"]
    certificates = ["self_signed"]
    env = { .env = true }

[mounts]
  # Persistent volume for data directory (Chroma DB, uploads, page images)
  source = "data"
  destination = "/app/data"

[env]
  # Add any additional env vars here

[processes]
  api = "cd /app && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"

[experimental]
  # Enable features if needed
  allowed_unsafe_updates = []
PYTHON_VERSION = "3.11"
"